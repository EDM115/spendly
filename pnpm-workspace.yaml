allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": false
  better-sqlite3: true
  core-js: true
  esbuild: true
  prisma: false
  sharp: true
  unrs-resolver: true

dedupePeers: true

lockfileIncludeTarballUrl: true

minimumReleaseAge: 120

minimumReleaseAgeExclude:
  - '@dotenvx/dotenvx@2.15.0'

publicHoistPattern:
  - "*vuetify*"

resolutionMode: highest

savePrefix: ""

allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": false
  better-sqlite3: true
  core-js: true
  esbuild: true
  prisma: false
  sharp: true
  unrs-resolver: true

dedupePeers: true

lockfileIncludeTarballUrl: true

minimumReleaseAgeExclude:
  - '@dotenvx/dotenvx@2.4.1'
  - '@nuxtjs/i18n@10.4.1'
  - eslint@10.7.0

overrides:
  vite: ~8.0.16

publicHoistPattern:
  - "*vuetify*"

resolutionMode: highest

savePrefix: ""

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  better-sqlite3: true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

lockfileIncludeTarballUrl: true

overrides:
  citty: "~0.2.1"
  eslint: "~10.0.0"
  magicast: "~0.5.2"

publicHoistPattern:
  - '*vuetify*'

resolutionMode: highest

savePrefix: ''
